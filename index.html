<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, Helvetica, sans-serif; color: #222; max-width: 900px; margin: 30px auto; padding: 0 16px; }
  .topbar { height: 10px; background: #1e2a78; border-radius: 3px 3px 0 0; }
  .header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; border-bottom: 6px solid #1e2a78; padding: 15px 0; }
  .brand img { height: 75px; width: auto; }
  .contact { font-size: 14px; text-align: right; line-height: 1.6; }
  h1 { text-align: center; letter-spacing: 2px; margin: 25px 0; }

  .meta { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
  .box { border: 1px solid #333; border-radius: 6px; padding: 10px 15px; flex: 1 1 320px; }
  .box p { margin: 6px 0; display: flex; gap: 6px; }
  .box label { color: #555; white-space: nowrap; }
  [contenteditable] { outline: none; }
  [contenteditable]:hover { background: #fffbe6; }
  [contenteditable]:focus { background: #fff3b0; }
  .field { flex: 1; border-bottom: 1px solid #999; min-height: 20px; padding: 0 2px; }
  .field:empty:before { content: attr(data-placeholder); color: #999; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 560px; }
  th, td { border: 1px solid #333; padding: 8px; text-align: left; font-size: 14px; }
  th { background: #f0f0f0; }
  td[data-role="qty"], td[data-role="price"], td[data-role="linetotal"] { text-align: right; width: 100px; }
  td[data-role="linetotal"] { background: #fafafa; }
  td.desc:empty:before { content: "Item description"; color: #bbb; }
  th.actioncol, td.actioncol { border: none; width: 30px; padding: 4px; text-align: center; }
  .del-row { cursor: pointer; color: #c0392b; font-weight: bold; background: none; border: none; font-size: 16px; }

  tfoot td { font-weight: bold; text-align: right; }
  tfoot td:last-child { font-weight: normal; }

  .signoff { margin-top: 25px; }
  .signoff .line { margin: 10px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; }

  .toolbar { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
  .toolbar button { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; font-weight: bold; }
  #addRowBtn { background: #1e2a78; color: #fff; }
  #printBtn { background: #e83a2f; color: #fff; }

  @media (max-width: 640px) {
    .header { flex-direction: column; }
    .contact { text-align: left; }
    .box { flex: 1 1 100%; }
  }

  @media print {
    .toolbar, .actioncol { display: none !important; }
    body { margin: 0; }
    [contenteditable]:hover, [contenteditable]:focus { background: none; }
    .field:empty:before, td.desc:empty:before { content: ""; }
  }
</style>

  <table id="itemsTable">
    <thead>
      <tr>
        <th>QUANTITY</th>
        <th>DESCRIPTION</th>
        <th>UNIT PRICE</th>
        <th>TOTAL PRICE</th>
        <th class="actioncol"></th>
      </tr>
    </thead>
    <tbody>
      <tr class="item">
        <td contenteditable data-role="qty">1</td>
        <td contenteditable class="desc" data-role="desc"></td>
        <td contenteditable data-role="price">0.00</td>
        <td data-role="linetotal">0.00</td>
        <td class="actioncol"><button class="del-row" title="Remove row">✕</button></td>
      </tr>
    </tbody>
    <tfoot>
      <tr><td colspan="3">SUB TOTAL</td><td id="subtotal">0.00</td><td class="actioncol"></td></tr>
      <tr><td colspan="3">14% VAT</td><td id="vat">0.00</td><td class="actioncol"></td></tr>
      <tr><td colspan="3">GRAND TOTAL</td><td id="grandtotal">0.00</td><td class="actioncol"></td></tr>
    </tfoot>
  </table>
  </div>

  <div class="toolbar">
    <button id="addRowBtn" type="button">+ Add Row</button>
    <button id="printBtn" type="button">🖨 Print / Save PDF</button>
  </div>

  <div class="signoff">
    <p class="line"><label>Payment terms:</label><span class="field" contenteditable></span></p>
    <p class="line"><label>Name:</label><span class="field" contenteditable></span><label>Sign:</label><span class="field" contenteditable></span><label>Date:</label><span class="field" contenteditable></span></p>
    <p class="line"><label>Invoiced by:</label><span class="field" contenteditable></span><label>Date:</label><span class="field" contenteditable></span></p>
  </div>

<script>
// ponytail: vanilla JS, event delegation, no framework/build step needed for a single-page editable invoice
const tbody = document.querySelector('#itemsTable tbody');

function rowTemplate() {
  const tr = document.createElement('tr');
  tr.className = 'item';
  tr.innerHTML = `
    <td contenteditable data-role="qty">1</td>
    <td contenteditable class="desc" data-role="desc"></td>
    <td contenteditable data-role="price">0.00</td>
    <td data-role="linetotal">0.00</td>
    <td class="actioncol"><button class="del-row" title="Remove row">✕</button></td>`;
  return tr;
}

function num(v) {
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
}

function recalc() {
  let subtotal = 0;
  tbody.querySelectorAll('tr').forEach(tr => {
    const qty = num(tr.querySelector('[data-role="qty"]').textContent);
    const price = num(tr.querySelector('[data-role="price"]').textContent);
    const lineTotal = qty * price;
    tr.querySelector('[data-role="linetotal"]').textContent = lineTotal.toFixed(2);
    subtotal += lineTotal;
  });
  const vat = subtotal * 0.14;
  document.getElementById('subtotal').textContent = subtotal.toFixed(2);
  document.getElementById('vat').textContent = vat.toFixed(2);
  document.getElementById('grandtotal').textContent = (subtotal + vat).toFixed(2);
}

document.getElementById('addRowBtn').addEventListener('click', () => {
  tbody.appendChild(rowTemplate());
});

tbody.addEventListener('click', e => {
  if (e.target.classList.contains('del-row')) {
    if (tbody.children.length > 1) e.target.closest('tr').remove();
    recalc();
  }
});

tbody.addEventListener('input', recalc);
document.getElementById('printBtn').addEventListener('click', () => window.print());

recalc();
</script>
</body>
</html>
